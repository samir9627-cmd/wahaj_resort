<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحجز | استراحة وهج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/logo3d.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <style>
        .confirmation-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, var(--navy-light) 100%);
            padding: 120px 20px 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .confirmation-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
        }
        
        .confirmation-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 50px 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
            animation: cardAppear 0.6s ease;
        }
        
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--success), #20C997);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 3.5rem;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
            animation: successPulse 2s infinite;
        }
        
        @keyframes successPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 15px 45px rgba(40, 167, 69, 0.6); }
        }
        
        .confirmation-title {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--navy);
            text-align: center;
            margin-bottom: 15px;
        }
        
        .confirmation-subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 35px;
            font-size: 1rem;
        }
        
        .booking-id-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border: 2px dashed var(--gold);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .booking-id-label {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .booking-id-value {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--gold-dark);
            letter-spacing: 2px;
        }
        
        .details-grid {
            background: var(--off-white);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-light);
            font-size: 0.95rem;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .detail-label i {
            color: var(--gold);
            width: 18px;
        }
        
        .detail-value {
            color: var(--navy);
            font-weight: 700;
            text-align: left;
        }
        
        .detail-row.highlight {
            background: rgba(212, 175, 55, 0.1);
            padding: 15px;
            margin: 5px -10px;
            border-radius: var(--radius-sm);
            border-bottom: none;
        }
        
        .detail-row.highlight .detail-value {
            color: var(--gold-dark);
            font-size: 1.2rem;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin: 0 auto 25px;
            background: rgba(255, 193, 7, 0.15);
            color: #856404;
            border: 2px solid rgba(255, 193, 7, 0.3);
        }
        
        .status-badge i {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .info-box {
            background: linear-gradient(135deg, rgba(10, 31, 68, 0.05), rgba(10, 31, 68, 0.02));
            border-right: 4px solid var(--navy);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .info-box h4 {
            color: var(--navy);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        
        .info-box h4 i {
            color: var(--gold);
        }
        
        .info-box ol {
            padding-right: 20px;
            color: var(--navy);
            font-size: 0.95rem;
            line-height: 1.9;
        }
        
        .info-box li {
            margin-bottom: 8px;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .action-buttons .btn {
            width: 100%;
            justify-content: center;
            padding: 14px 20px;
            font-size: 0.95rem;
        }
        
        .btn-whatsapp {
            background: #25D366;
            color: var(--white);
            border: 2px solid #25D366;
        }
        
        .btn-whatsapp:hover {
            background: #1EAE54;
            border-color: #1EAE54;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
        }
        
        .btn-print {
            background: var(--navy);
            color: var(--white);
            border: 2px solid var(--navy);
        }
        
        .btn-print:hover {
            background: var(--navy-light);
            transform: translateY(-3px);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--gray);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-link a:hover {
            color: var(--gold-dark);
        }
        
        .no-booking {
            text-align: center;
            padding: 40px 20px;
        }
        
        .no-booking i {
            font-size: 4rem;
            color: var(--gray-light);
            margin-bottom: 20px;
        }
        
        .no-booking h3 {
            color: var(--navy);
            margin-bottom: 15px;
        }
        
        .no-booking p {
            color: var(--gray);
            margin-bottom: 25px;
        }
        
        @media (max-width: 768px) {
            .confirmation-card {
                padding: 35px 25px;
            }
            
            .booking-id-value {
                font-size: 1.4rem;
            }
            
            .confirmation-title {
                font-size: 1.6rem;
            }
            
            .success-icon {
                width: 80px;
                height: 80px;
                font-size: 2.8rem;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .detail-value {
                text-align: right;
                width: 100%;
            }
        }
        
        @media print {
            .action-buttons,
            .back-link,
            .whatsapp-float,
            .scroll-top {
                display: none !important;
            }
            
            .confirmation-page {
                background: var(--white);
                padding: 20px;
            }
            
            .confirmation-card {
                box-shadow: none;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- ═══ شريط التنقل ═══ -->
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <img src="images/logo.png" alt="استراحة وهج" class="nav-logo-img">
            <span class="nav-logo-text">وهج</span>
        </a>
        
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="details.html">التفاصيل</a></li>
            <li><a href="policies.html">السياسات</a></li>
            <li><a href="booking.html" class="nav-cta">
                <i class="fas fa-calendar-check"></i> احجز الآن
            </a></li>
        </ul>
        
        <div class="nav-toggle" id="navToggle">
            <i class="fas fa-bars"></i>
        </div>
    </div>
</nav>

<!-- ═══ صفحة التأكيد ═══ -->
<section class="confirmation-page">
    <div class="confirmation-card" id="confirmationCard">
        <!-- سيتم تعبئتها بالجافاسكربت -->
    </div>
</section>

<!-- ═══ السكربتات ═══ -->
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/whatsapp.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const card = document.getElementById('confirmationCard');
    
    // جلب بيانات الحجز من localStorage
    let bookingData = null;
    
    try {
        // أولاً: من رابط URL
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');
        
        // ثم: من localStorage
        const lastBooking = localStorage.getItem('wahaj_last_booking');
        if (lastBooking) {
            bookingData = JSON.parse(lastBooking);
        }
        
        // إذا لم يجد حجز
        if (!bookingData) {
            card.innerHTML = `
                <div class="no-booking">
                    <i class="fas fa-search"></i>
                    <h3>لا يوجد حجز</h3>
                    <p>لم نجد أي حجز حديث. الرجاء القيام بحجز جديد.</p>
                    <a href="booking.html" class="btn btn-primary">
                        <i class="fas fa-calendar-plus"></i>
                        احجز الآن
                    </a>
                </div>
            `;
            return;
        }
        
        // عرض تفاصيل الحجز
        renderBooking(bookingData);
        
    } catch (e) {
        console.error('خطأ في قراءة البيانات:', e);
        card.innerHTML = `
            <div class="no-booking">
                <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                <h3>حدث خطأ</h3>
                <p>لم نتمكن من قراءة بيانات الحجز.</p>
                <a href="booking.html" class="btn btn-primary">
                    <i class="fas fa-redo"></i>
                    حاول مرة أخرى
                </a>
            </div>
        `;
    }
    
    function renderBooking(data) {
        const whatsappMessage = `السلام عليكم،
أرغب في تأكيد الحجز التالي:

📋 رقم الحجز: ${data.bookingId}
📅 التاريخ: ${data.dateFormatted}
⏰ نوع الحجز: ${data.bookingType}
🕐 التوقيت: ${data.bookingTypeDesc}

👤 الاسم: ${data.fullName}
📞 الجوال: ${data.phone}
👥 عدد الضيوف: ${data.guests}

💰 السعر الإجمالي: ${data.total} ر.ع
💵 العربون المدفوع: ${data.deposit} ر.ع
💳 الباقي عند الدخول: ${data.remaining} ر.ع
🛡️ التأمين: ${data.security} ر.ع

أرفقت لكم صورة الإيصال.
شكراً لكم 🌟`;

        const whatsappUrl = WAHAJ_CONFIG.getWhatsAppLink(whatsappMessage);
        
        card.innerHTML = `
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            
            <h1 class="confirmation-title">تم استلام طلبك بنجاح!</h1>
            <p class="confirmation-subtitle">بانتظار تأكيد الإدارة، سيتم التواصل معك قريباً</p>
            
            <div class="status-badge">
                <i class="fas fa-clock"></i>
                <span>بانتظار التأكيد</span>
            </div>
            
            <div class="booking-id-box">
                <div class="booking-id-label">رقم الحجز</div>
                <div class="booking-id-value">${data.bookingId}</div>
            </div>
            
            <div class="details-grid">
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-calendar-day"></i> التاريخ</span>
                    <span class="detail-value">${data.dateFormatted}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-tag"></i> نوع اليوم</span>
                    <span class="detail-value">${data.dayType}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-clock"></i> نوع الحجز</span>
                    <span class="detail-value">${data.bookingType}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-hourglass-half"></i> التوقيت</span>
                    <span class="detail-value">${data.bookingTypeDesc}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-user"></i> الاسم</span>
                    <span class="detail-value">${data.fullName}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-phone"></i> الجوال</span>
                    <span class="detail-value">${data.phone}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-users"></i> عدد الضيوف</span>
                    <span class="detail-value">${data.guests}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-money-bill-wave"></i> السعر الإجمالي</span>
                    <span class="detail-value">${data.total} ر.ع</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-hand-holding-usd"></i> العربون</span>
                    <span class="detail-value" style="color: var(--gold-dark);">${data.deposit} ر.ع</span>
                </div>
                <div class="detail-row highlight">
                    <span class="detail-label"><i class="fas fa-money-check-alt"></i> الباقي عند الدخول</span>
                    <span class="detail-value">${data.remaining} ر.ع</span>
                </div>
            </div>
            
            <div class="info-box">
                <h4><i class="fas fa-info-circle"></i> الخطوات القادمة</h4>
                <ol>
                    <li>سيتم مراجعة طلبك والتأكد من الإيصال</li>
                    <li>سيتم التواصل معك عبر الواتساب لتأكيد الحجز</li>
                    <li>يرجى الاحتفاظ برقم الحجز <strong>${data.bookingId}</strong></li>
                    <li>الباقي (${data.remaining} ر.ع) يُدفع قبل الدخول بيوم</li>
                    <li>التأمين (${data.security} ر.ع) يُرد بعد الخروج</li>
                </ol>
            </div>
            
            <div class="action-buttons">
                <a href="${whatsappUrl}" target="_blank" class="btn btn-whatsapp">
                    <i class="fab fa-whatsapp"></i>
                    تأكيد عبر واتساب
                </a>
                <button onclick="window.print()" class="btn btn-print">
                    <i class="fas fa-print"></i>
                    طباعة الحجز
                </button>
            </div>
            
            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-right"></i>
                    العودة للصفحة الرئيسية
                </a>
            </div>
        `;
    }
});
</script>

<!-- ═══ زر واتساب عائم ═══ -->

   target="_blank" 
   class="whatsapp-float" 
   title="تواصل عبر واتساب">
    <i class="fab fa-whatsapp"></i>
</a>

</body>
</html>
