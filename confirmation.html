<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0A1F44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>تأكيد الحجز | استراحة وهج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    
    <style>
        .confirmation-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, var(--navy-light) 100%);
            padding: 100px 20px 100px;
            position: relative;
            overflow: hidden;
        }
        
        .confirmation-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(212, 175, 55, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .confirmation-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px 25px;
            max-width: 550px;
            margin: 0 auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
            animation: cardAppear 0.6s ease;
        }
        
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .success-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--success), #20C997);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 3rem;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
            animation: successPulse 2s infinite;
        }
        
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .confirmation-title {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--navy);
            text-align: center;
            margin-bottom: 10px;
        }
        
        .confirmation-subtitle {
            text-align: center;
            color: var(--gray-600);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 0 auto 25px;
            background: rgba(255, 193, 7, 0.15);
            color: #856404;
            border: 2px solid rgba(255, 193, 7, 0.3);
        }
        
        .status-badge-wrapper {
            text-align: center;
        }
        
        .status-badge i {
            animation: pulseIcon 2s infinite;
        }
        
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .booking-id-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border: 2px dashed var(--primary);
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .booking-id-label {
            color: var(--gray-600);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        
        .booking-id-value {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: 2px;
        }
        
        .details-grid {
            background: var(--gray-100);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.85rem;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .detail-label i {
            color: var(--primary);
            width: 16px;
        }
        
        .detail-value {
            color: var(--navy);
            font-weight: 700;
            text-align: left;
        }
        
        .detail-row.highlight {
            background: rgba(212, 175, 55, 0.1);
            padding: 12px 15px;
            margin: 5px -10px;
            border-radius: var(--radius-sm);
            border-bottom: none;
        }
        
        .detail-row.highlight .detail-value {
            color: var(--primary-dark);
            font-size: 1.1rem;
        }
        
        .info-box {
            background: linear-gradient(135deg, rgba(10, 31, 68, 0.05), rgba(10, 31, 68, 0.02));
            border-right: 4px solid var(--navy);
            border-radius: var(--radius-sm);
            padding: 18px;
            margin-bottom: 20px;
        }
        
        .info-box h4 {
            color: var(--navy);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        
        .info-box h4 i {
            color: var(--primary);
        }
        
        .info-box ol {
            padding-right: 20px;
            color: var(--navy);
            font-size: 0.85rem;
            line-height: 1.8;
        }
        
        .info-box li {
            margin-bottom: 6px;
        }
        
        .info-box strong {
            color: var(--primary-dark);
        }
        
        .action-buttons {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .action-btn-app {
            padding: 14px;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            border: none;
        }
        
        .action-btn-app.whatsapp {
            background: #25D366;
            color: var(--white);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        
        .action-btn-app.whatsapp:active {
            transform: scale(0.97);
        }
        
        .action-btn-app.print {
            background: var(--navy);
            color: var(--white);
        }
        
        .action-btn-app.print:active {
            transform: scale(0.97);
        }
        
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .back-link a {
            color: var(--gray-600);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        
        .no-booking {
            text-align: center;
            padding: 30px 15px;
        }
        
        .no-booking i {
            font-size: 3.5rem;
            color: var(--gray-200);
            margin-bottom: 15px;
        }
        
        .no-booking h3 {
            color: var(--navy);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .no-booking p {
            color: var(--gray-600);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        @media print {
            .action-buttons,
            .back-link,
            .floating-whatsapp,
            .bottom-nav,
            .sticky-booking {
                display: none !important;
            }
            
            .confirmation-page {
                background: var(--white);
                padding: 20px;
            }
            
            .confirmation-card {
                box-shadow: none;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash-screen">
    <img src="images/logo.jpeg" alt="استراحة وهج" class="splash-logo">
    <h1 class="splash-title">وهج</h1>
    <p class="splash-subtitle">خصوصية .. راحة .. ذكريات لا تُنسى</p>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

<!-- HEADER -->
<header class="app-header">
    <div class="app-header-logo">
        <img src="images/logo.jpeg" alt="وهج" class="app-header-logo-svg">
        <span class="app-header-title">استراحة <span>وهج</span></span>
    </div>
    <a href="index.html" class="app-header-action" aria-label="الرئيسية">
        <i class="fas fa-home"></i>
    </a>
</header>

<!-- CONFIRMATION PAGE -->
<section class="confirmation-page">
    <div class="confirmation-card" id="confirmationCard">
        <!-- يتم تعبئتها بـ JavaScript -->
    </div>
</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
        <i class="fas fa-home"></i>
        <span>الرئيسية</span>
    </a>
    <a href="details.html" class="bottom-nav-item">
        <i class="fas fa-images"></i>
        <span>المعرض</span>
    </a>
    <a href="booking.html" class="bottom-nav-item cta-item">
        <div class="cta-circle"><i class="fas fa-calendar-plus"></i></div>
        <span>احجز</span>
    </a>
    <a href="policies.html" class="bottom-nav-item">
        <i class="fas fa-file-contract"></i>
        <span>السياسات</span>
    </a>
    <a href="https://wa.me/96895566332" target="_blank" class="bottom-nav-item">
        <i class="fab fa-whatsapp"></i>
        <span>تواصل</span>
    </a>
</nav>

<a href="https://wa.me/96895566332?text=مرحباً" target="_blank" class="floating-whatsapp">
    <i class="fab fa-whatsapp"></i>
</a>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/brand.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const card = document.getElementById('confirmationCard');
    
    let bookingData = null;
    
    try {
        const lastBooking = localStorage.getItem('wahaj_last_booking');
        if (lastBooking) {
            bookingData = JSON.parse(lastBooking);
        }
    } catch (e) {
        console.error('خطأ:', e);
    }
    
    if (!bookingData) {
        card.innerHTML = `
            <div class="no-booking">
                <i class="fas fa-search"></i>
                <h3>لا يوجد حجز</h3>
                <p>لم نجد أي حجز حديث. الرجاء القيام بحجز جديد.</p>
                <a href="booking.html" class="action-btn-app" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--navy);">
                    <i class="fas fa-calendar-plus"></i>
                    احجز الآن
                </a>
            </div>
        `;
        return;
    }
    
    renderBooking(bookingData);
    
    function renderBooking(data) {
        const whatsappMessage = `السلام عليكم،
أرغب في تأكيد الحجز التالي:

📋 رقم الحجز: ${data.bookingId}
📅 التاريخ: ${data.dateFormatted}
⏰ نوع الحجز: ${data.bookingType}
🕐 التوقيت: ${data.bookingTypeDesc}

👤 الاسم: ${data.fullName}
📞 الجوال: ${data.phone}
👥 عدد الضيوف: ${data.guests}

💰 السعر الإجمالي: ${data.total} ر.ع
💵 العربون المدفوع: ${data.deposit} ر.ع
💳 الباقي عند الدخول: ${data.remaining} ر.ع
🛡️ التأمين: ${data.security} ر.ع

أرفقت لكم صورة الإيصال.
شكراً لكم 🌟`;

        const whatsappUrl = 'https://wa.me/96895566332?text=' + encodeURIComponent(whatsappMessage);
        
        card.innerHTML = `
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            
            <h1 class="confirmation-title">تم استلام طلبك!</h1>
            <p class="confirmation-subtitle">بانتظار تأكيد الإدارة، سيتم التواصل معك قريباً</p>
            
            <div class="status-badge-wrapper">
                <div class="status-badge">
                    <i class="fas fa-clock"></i>
                    <span>بانتظار التأكيد</span>
                </div>
            </div>
            
            <div class="booking-id-box">
                <div class="booking-id-label">رقم الحجز</div>
                <div class="booking-id-value">${data.bookingId}</div>
            </div>
            
            <div class="details-grid">
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-calendar-day"></i> التاريخ</span>
                    <span class="detail-value">${data.dateFormatted}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-tag"></i> نوع اليوم</span>
                    <span class="detail-value">${data.dayType}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-clock"></i> نوع الحجز</span>
                    <span class="detail-value">${data.bookingType}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-hourglass-half"></i> التوقيت</span>
                    <span class="detail-value">${data.bookingTypeDesc}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-user"></i> الاسم</span>
                    <span class="detail-value">${data.fullName}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-phone"></i> الجوال</span>
                    <span class="detail-value">${data.phone}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-users"></i> الضيوف</span>
                    <span class="detail-value">${data.guests}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-money-bill-wave"></i> الإجمالي</span>
                    <span class="detail-value">${data.total} ر.ع</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-hand-holding-usd"></i> العربون</span>
                    <span class="detail-value" style="color: var(--primary-dark);">${data.deposit} ر.ع</span>
                </div>
                <div class="detail-row highlight">
                    <span class="detail-label"><i class="fas fa-money-check-alt"></i> الباقي عند الدخول</span>
                    <span class="detail-value">${data.remaining} ر.ع</span>
                </div>
            </div>
            
            <div class="info-box">
                <h4><i class="fas fa-info-circle"></i> الخطوات القادمة</h4>
                <ol>
                    <li>سيتم مراجعة طلبك والتأكد من الإيصال</li>
                    <li>سيتم التواصل معك عبر الواتساب لتأكيد الحجز</li>
                    <li>يرجى الاحتفاظ برقم الحجز <strong>${data.bookingId}</strong></li>
                    <li>الباقي (${data.remaining} ر.ع) يُدفع قبل الدخول بيوم</li>
                    <li>التأمين (${data.security} ر.ع) يُرد بعد الخروج</li>
                </ol>
            </div>
            
            <div class="action-buttons">
                <a href="${whatsappUrl}" target="_blank" class="action-btn-app whatsapp">
                    <i class="fab fa-whatsapp"></i>
                    تأكيد عبر واتساب
                </a>
                <button onclick="window.print()" class="action-btn-app print">
                    <i class="fas fa-print"></i>
                    طباعة الحجز
                </button>
            </div>
            
            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-right"></i>
                    العودة للرئيسية
                </a>
            </div>
        `;
    }
});
</script>

</body>
</html>
