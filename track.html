<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0A1F44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تتبع حجزك | استراحة وهج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="images/logo.jpeg">
<style>
/* ═══ Hero صفحة التتبع ═══ */
.track-hero{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 60%,var(--navy-light) 100%);padding:100px 20px 40px;color:var(--white);text-align:center;position:relative;overflow:hidden}
.track-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(212,175,55,0.2) 0%,transparent 50%);pointer-events:none}
.track-hero-content{position:relative;z-index:2}
.track-hero h1{font-family:'Amiri',serif;font-size:clamp(1.8rem,6vw,2.5rem);color:var(--primary);margin-bottom:10px;text-shadow:0 0 30px rgba(212,175,55,0.5)}
.track-hero p{font-size:0.95rem;opacity:0.9}
.track-hero-icon{width:70px;height:70px;margin:0 auto 15px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:2rem;box-shadow:0 10px 30px rgba(212,175,55,0.5);animation:trackPulse 2s infinite}
@keyframes trackPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ═══ قسم البحث ═══ */
.track-main{padding:30px 20px 100px}
.track-search-card{background:var(--white);border-radius:var(--radius);padding:25px 20px;box-shadow:var(--shadow-md);border-top:4px solid var(--primary);margin-bottom:20px}
.track-search-title{font-family:'Amiri',serif;font-size:1.2rem;color:var(--navy);margin-bottom:15px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.track-search-title i{color:var(--primary)}
.track-field{margin-bottom:15px}
.track-field label{display:block;font-size:0.85rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.track-field input{width:100%;padding:14px 16px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:1rem;background:var(--white);color:var(--navy);transition:all 0.2s;text-align:center;letter-spacing:1px}
.track-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(212,175,55,0.15)}
.track-field input::placeholder{color:var(--gray-400);font-size:0.9rem;letter-spacing:0}
.track-search-btn{width:100%;padding:15px;border-radius:50px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--navy);font-weight:900;font-size:1rem;border:none;cursor:pointer;transition:all 0.2s;box-shadow:0 10px 30px rgba(212,175,55,0.4);font-family:'Cairo',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.track-search-btn:active{transform:scale(0.97)}
.track-search-btn:disabled{opacity:0.6;cursor:not-allowed}
.track-note{text-align:center;margin-top:12px;font-size:0.75rem;color:var(--gray-600);line-height:1.6}
.track-note i{color:var(--primary)}

/* ═══ حالة الأخطاء ═══ */
.track-error{background:linear-gradient(135deg,#FFE5E5,#FFCCCC);border:2px solid #DC3545;border-radius:var(--radius-sm);padding:20px;margin-bottom:15px;display:flex;align-items:center;gap:15px;animation:shakeError 0.5s ease}
@keyframes shakeError{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.track-error-icon{width:50px;height:50px;border-radius:50%;background:#DC3545;color:white;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.track-error-content h4{color:#721c24;font-size:0.95rem;margin-bottom:3px}
.track-error-content p{color:#721c24;font-size:0.8rem;margin:0;opacity:0.85}

/* ═══ حالة النجاح - تفاصيل الحجز ═══ */
.track-result{animation:fadeInUp 0.5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.track-status-card{border-radius:var(--radius);padding:20px;margin-bottom:15px;text-align:center;position:relative;overflow:hidden}
.track-status-card::before{content:'';position:absolute;top:0;right:0;width:100%;height:5px}
.track-status-card.pending{background:linear-gradient(135deg,#FFF3CD,#FFEBA5);border:2px solid #FFC107}
.track-status-card.pending::before{background:#FFC107}
.track-status-card.confirmed{background:linear-gradient(135deg,#D4EDDA,#C3E6CB);border:2px solid #28A745}
.track-status-card.confirmed::before{background:#28A745}
.track-status-card.rejected{background:linear-gradient(135deg,#F8D7DA,#F5C6CB);border:2px solid #DC3545}
.track-status-card.rejected::before{background:#DC3545}
.track-status-icon{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:white;box-shadow:0 8px 25px rgba(0,0,0,0.2)}
.track-status-card.pending .track-status-icon{background:#FFC107}
.track-status-card.confirmed .track-status-icon{background:#28A745;animation:statusPulse 2s infinite}
.track-status-card.rejected .track-status-icon{background:#DC3545}
@keyframes statusPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 12px 35px rgba(40,167,69,0.5)}}
.track-status-card h3{font-size:1.2rem;margin-bottom:5px;font-weight:900}
.track-status-card.pending h3{color:#856404}
.track-status-card.confirmed h3{color:#155724}
.track-status-card.rejected h3{color:#721c24}
.track-status-card p{font-size:0.85rem;opacity:0.85;margin:0}

/* ═══ تفاصيل الحجز ═══ */
.track-details-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:15px}
.track-details-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:15px;padding-bottom:12px;border-bottom:2px dashed var(--gray-200);display:flex;align-items:center;gap:8px}
.track-details-title i{color:var(--primary)}
.track-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:0.85rem}
.track-row:last-child{border-bottom:none}
.track-row .label{color:var(--gray-600);display:flex;align-items:center;gap:6px}
.track-row .label i{color:var(--primary);width:16px;font-size:0.8rem}
.track-row .value{color:var(--navy);font-weight:700;text-align:left}
.track-row.total{border-top:2px solid var(--primary);margin-top:8px;padding-top:12px;font-size:1rem}
.track-row.total .value{color:var(--primary-dark);font-size:1.15rem}
.track-row.paid .value{color:var(--success)}
.track-row.remaining .value{color:var(--danger)}

/* ═══ التقدم ═══ */
.track-progress{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:15px}
.track-progress-title{font-size:0.95rem;font-weight:700;color:var(--navy);margin-bottom:15px;display:flex;align-items:center;gap:8px}
.track-progress-title i{color:var(--primary)}
.track-progress-bar{height:10px;background:var(--gray-200);border-radius:50px;overflow:hidden;margin-bottom:10px}
.track-progress-fill{height:100%;background:linear-gradient(90deg,var(--success),#20C997);border-radius:50px;transition:width 0.5s ease}
.track-progress-text{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--gray-600)}

/* ═══ التذكيرات ═══ */
.track-reminder{background:linear-gradient(135deg,rgba(220,53,69,0.1),rgba(220,53,69,0.05));border:2px solid var(--danger);border-radius:var(--radius);padding:15px;margin-bottom:15px;display:flex;align-items:flex-start;gap:12px;animation:reminderPulse 2s infinite}
@keyframes reminderPulse{0%,100%{box-shadow:0 0 0 rgba(220,53,69,0.3)}50%{box-shadow:0 0 20px rgba(220,53,69,0.5)}}
.track-reminder-icon{width:45px;height:45px;border-radius:50%;background:var(--danger);color:white;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;animation:bellRing 1s infinite}
@keyframes bellRing{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.track-reminder-content h4{color:var(--danger);font-size:0.9rem;margin-bottom:4px;font-weight:900}
.track-reminder-content p{color:#721c24;font-size:0.8rem;margin:0;line-height:1.6}

/* ═══ رفع إيصال الباقي ═══ */
.track-upload-section{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:15px}
.track-upload-title{font-size:0.95rem;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.track-upload-title i{color:var(--primary)}
.track-upload-area{border:2px dashed var(--gray-400);border-radius:var(--radius-sm);padding:25px 15px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--gray-100);position:relative}
.track-upload-area:active{border-color:var(--primary);background:rgba(212,175,55,0.05)}
.track-upload-area input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.track-upload-icon{font-size:2rem;color:var(--primary);margin-bottom:10px}
.track-upload-area h4{color:var(--navy);font-size:0.9rem;margin-bottom:5px}
.track-upload-area p{color:var(--gray-600);font-size:0.75rem;margin:0}
.track-upload-preview{margin-top:12px;display:none}
.track-upload-preview.show{display:block}
.track-upload-preview img{max-width:150px;border-radius:var(--radius-sm);box-shadow:var(--shadow);margin:0 auto}
.track-upload-btn{width:100%;padding:13px;border-radius:50px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--navy);font-weight:900;font-size:0.9rem;border:none;cursor:pointer;transition:all 0.2s;box-shadow:0 6px 20px rgba(212,175,55,0.35);font-family:'Cairo',sans-serif;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.track-upload-btn:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none}
.track-upload-btn:active:not(:disabled){transform:scale(0.97)}

/* ═══ التواريخ ═══ */
.track-dates-info{background:linear-gradient(135deg,rgba(10,31,68,0.05),rgba(10,31,68,0.02));border-right:4px solid var(--navy);border-radius:var(--radius-sm);padding:12px 15px;font-size:0.8rem;color:var(--navy);line-height:1.7;margin-top:12px}
.track-dates-info strong{color:var(--primary-dark)}

/* ═══ زر الإجراءات ═══ */
.track-actions{display:grid;gap:10px;margin-top:15px}
.track-action-btn{padding:13px;border-radius:50px;font-weight:700;font-size:0.9rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;font-family:'Cairo',sans-serif;border:2px solid transparent}
.track-action-btn.whatsapp{background:#25D366;color:white;box-shadow:0 6px 20px rgba(37,211,102,0.35)}
.track-action-btn.print{background:var(--navy);color:white}
.track-action-btn:active{transform:scale(0.97)}
</style>
</head>
