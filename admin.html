<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | استراحة وهج</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <style>
        body {
            background: var(--off-white);
        }
        
        /* ─── شاشة الدخول ─── */
        .login-screen {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, var(--navy-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .login-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
        }
        
        .login-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
            text-align: center;
            border-top: 5px solid var(--gold);
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2rem;
            box-shadow: var(--shadow-gold);
        }
        
        .login-card h1 {
            color: var(--navy);
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .login-card p {
            color: var(--gray);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .login-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }
        
        .login-error {
            color: var(--danger);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }
        
        .login-error.show {
            display: block;
            animation: shake 0.4s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* ─── لوحة التحكم ─── */
        .admin-screen {
            display: none;
            min-height: 100vh;
        }
        
        .admin-screen.show {
            display: block;
        }
        
        .admin-header {
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            color: var(--white);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .admin-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .admin-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
        }
        
        .admin-btn {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .admin-btn:hover {
            background: var(--gold);
            color: var(--navy);
        }
        
        .admin-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* ─── إحصائيات ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border-right: 4px solid var(--gold);
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--navy);
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        /* ─── أدوات الفلترة ─── */
        .filter-bar {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-bar label {
            color: var(--navy);
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            color: var(--navy);
            background: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        /* ─── جدول الحجوزات ─── */
        .bookings-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .bookings-header {
            padding: 20px 25px;
            border-bottom: 2px solid var(--gray-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .bookings-header h3 {
            color: var(--navy);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bookings-header h3 i {
            color: var(--gold);
        }
        
        .bookings-list {
            padding: 20px;
            display: grid;
            gap: 15px;
        }
        
        .booking-item {
            background: var(--off-white);
            border-radius: var(--radius);
            padding: 20px;
            border-right: 4px solid var(--gray);
            transition: var(--transition);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .booking-item.pending {
            border-right-color: #FFC107;
            background: rgba(255, 193, 7, 0.05);
        }
        
        .booking-item.confirmed {
            border-right-color: var(--success);
            background: rgba(40, 167, 69, 0.05);
        }
        
        .booking-item.rejected {
            border-right-color: var(--danger);
            background: rgba(220, 53, 69, 0.05);
        }
        
        .booking-item:hover {
            box-shadow: var(--shadow-md);
        }
        
        .booking-status-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--white);
            flex-shrink: 0;
        }
        
        .booking-item.pending .booking-status-icon {
            background: #FFC107;
        }
        
        .booking-item.confirmed .booking-status-icon {
            background: var(--success);
        }
        
        .booking-item.rejected .booking-status-icon {
            background: var(--danger);
        }
        
        .booking-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .booking-info-item {
            font-size: 0.9rem;
        }
        
        .booking-info-item strong {
            display: block;
            color: var(--gray);
            font-size: 0.8rem;
            margin-bottom: 3px;
            font-weight: 500;
        }
        
        .booking-info-item span {
            color: var(--navy);
            font-weight: 700;
        }
        
        .booking-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border-radius: 50px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            white-space: nowrap;
        }
        
        .action-btn.confirm {
            background: var(--success);
            color: var(--white);
        }
        
        .action-btn.confirm:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .action-btn.reject {
            background: var(--danger);
            color: var(--white);
        }
        
        .action-btn.reject:hover {
            background: #C82333;
            transform: translateY(-2px);
        }
        
        .action-btn.whatsapp {
            background: #25D366;
            color: var(--white);
        }
        
        .action-btn.whatsapp:hover {
            background: #1EAE54;
        }
        
        .action-btn.delete {
            background: var(--gray-light);
            color: var(--gray);
        }
        
        .action-btn.delete:hover {
            background: var(--gray);
            color: var(--white);
        }
        
        .no-bookings {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        
        .no-bookings i {
            font-size: 4rem;
            color: var(--gray-light);
            margin-bottom: 20px;
        }
        
        .no-bookings h3 {
            color: var(--navy);
            margin-bottom: 10px;
        }
        
        /* ─── Modal التفاصيل ─── */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 21, 48, 0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--white);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            animation: modalAppear 0.3s ease;
        }
        
        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--gray-light);
            color: var(--navy);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .modal-close:hover {
            background: var(--danger);
            color: var(--white);
            transform: rotate(90deg);
        }
        
        .modal-content h2 {
            color: var(--navy);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .modal-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-light);
        }
        
        .modal-detail strong {
            color: var(--gray);
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .modal-detail span {
            color: var(--navy);
            font-weight: 700;
        }
        
        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .admin-header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .admin-container {
                padding: 20px 15px;
            }
            
            .booking-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .booking-actions {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .action-btn {
                flex: 1;
                min-width: 100px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            .login-card {
                padding: 35px 25px;
            }
        }
        
        /* ─── طباعة ─── */
        @media print {
            .admin-header,
            .filter-bar,
            .booking-actions {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- 🔐 شاشة الدخول -->
<!-- ═══════════════════════════════════════════════════════ -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>لوحة التحكم</h1>
        <p>أدخل كلمة السر للوصول</p>
        
        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i> كلمة السر غير صحيحة
        </div>
        
        <input 
            type="password" 
            id="passwordInput" 
            class="login-input" 
            placeholder="••••••••" 
            autocomplete="off">
        
        <button class="btn btn-primary btn-large" style="width: 100%;" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i>
            دخول
        </button>
        
        <a href="index.html" style="display: inline-block; margin-top: 20px; color: var(--gray); font-size: 0.9rem;">
            <i class="fas fa-arrow-right"></i> العودة للرئيسية
        </a>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- 🎛️ لوحة التحكم -->
<!-- ═══════════════════════════════════════════════════════ -->
<div class="admin-screen" id="adminScreen">
    
    <!-- الهيدر -->
    <header class="admin-header">
        <div class="admin-logo">
            <img src="images/logo.png" alt="وهج">
            <span>لوحة التحكم</span>
        </div>
        
        <div class="admin-actions">
            <button class="admin-btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i>
                تحديث
            </button>
            <button class="admin-btn" id="exportBtn">
                <i class="fas fa-download"></i>
                تصدير
            </button>
            <button class="admin-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                خروج
            </button>
        </div>
    </header>
    
    <div class="admin-container">
        
        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">إجمالي الحجوزات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #FFC107;"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label">بانتظار التأكيد</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--success);"><i class="fas fa-check"></i></div>
                <div class="stat-value" id="statConfirmed">0</div>
                <div class="stat-label">مؤكدة</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--danger);"><i class="fas fa-times"></i></div>
                <div class="stat-value" id="statRejected">0</div>
                <div class="stat-label">مرفوضة</div>
            </div>
        </div>
        
        <!-- فلترة -->
        <div class="filter-bar">
            <label><i class="fas fa-filter"></i> فلترة:</label>
            <select class="filter-select" id="statusFilter">
                <option value="all">الكل</option>
                <option value="pending">بانتظار التأكيد</option>
                <option value="confirmed">مؤكدة</option>
                <option value="rejected">مرفوضة</option>
            </select>
            
            <label><i class="fas fa-search"></i> بحث:</label>
            <input 
                type="text" 
                class="filter-select" 
                id="searchInput" 
                placeholder="اسم، جوال، رقم حجز..."
                style="min-width: 200px;">
        </div>
        
        <!-- قائمة الحجوزات -->
        <div class="bookings-container">
            <div class="bookings-header">
                <h3><i class="fas fa-list"></i> الحجوزات</h3>
                <span style="color: var(--gray); font-size: 0.9rem;" id="bookingsCount"></span>
            </div>
            
            <div class="bookings-list" id="bookingsList">
                <!-- يتم تعبئتها بالجافاسكربت -->
            </div>
        </div>
        
    </div>
</div>

<!-- ═══ Modal التفاصيل ═══ -->
<div class="modal" id="detailsModal">
    <div class="modal-content" id="modalContent">
        <!-- يتم تعبئتها بالجافاسكربت -->
    </div>
</div>

<!-- ═══ السكربتات ═══ -->
<script src="js/config.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
